name: Build and Push Custom Wren UI

on:
  push:
    branches:
      - main # Triggers every time you merge to main
    paths:
      - 'wren-ui/**' # Only triggers if UI files changed
  workflow_dispatch: # Allows manual triggering from the Actions tab    

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants permission to push the image to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# --- ADD THESE TWO NEW BLOCKS ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wren-ui
          push: true
          platforms: linux/arm64
          # This automatically tags it with your GitHub username
          tags: ghcr.io/${{ github.repository_owner }}/wren-ui-fr:latest